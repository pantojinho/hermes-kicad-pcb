name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script syntax (both OSes)
        run: >
          python -m py_compile
          skills/kicad-pcb/scripts/kicad_paths.py
          skills/kicad-pcb/scripts/demo_autoroute.py
          skills/kicad-pcb/scripts/check_env.py
          skills/kicad-pcb/scripts/easyeda_bridge.py
          skills/kicad-pcb/scripts/esp32_example.py
      - name: SKILL.md frontmatter (real YAML parse)
        run: |
          pip install pyyaml -q
          python -c "import yaml; from pathlib import Path; t = Path('skills/kicad-pcb/SKILL.md').read_text(encoding='utf-8'); d = yaml.safe_load(t.split('---')[1]); assert d.get('name') == 'kicad-pcb', 'wrong name'; assert d.get('description') and len(str(d['description'])) <= 1024, 'description missing or > 1024'; print('frontmatter OK:', d['name'])"
      - name: check_env (informational - runner without KiCad must fail with useful messages)
        run: python skills/kicad-pcb/scripts/check_env.py

  windows-e2e:
    # Real Windows validation: install KiCad + Freerouting, run the full example
    # (schematic + board + autoroute + 3D render + schematic export), upload renders.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad (winget)
        run: winget install --id KiCad.KiCad -e --accept-source-agreements --accept-package-agreements
      - name: Install Freerouting (official MSI from GitHub releases)
        shell: pwsh
        run: |
          $url = "https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1-windows-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile freerouting.msi
          Start-Process msiexec -ArgumentList '/i','freerouting.msi','/qn' -Wait
          $fr = Get-ChildItem "C:\Program Files\Freerouting" -Recurse -Filter freerouting.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($fr) { "FREEROUTING_EXE=$($fr.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          "FREEROUTING_EXE=$($fr.FullName)"
      - name: Full example (ESP32 + LED + USB-C)
        # NOTE: kicad-cli is NOT on PATH (KiCad installer does not add bin\),
        # but the scripts resolve C:\Program Files\KiCad\*\bin\ themselves.
        shell: pwsh
        run: python skills/kicad-pcb/scripts/esp32_example.py --out out
      - name: Rename Windows renders
        shell: pwsh
        run: |
          if (Test-Path out/renders/board-top.png) { Move-Item out/renders/board-top.png example-3d-windows.png -Force } else { "3D render skipped on this runner" }
          if (Test-Path out/renders/schematic.png) { Move-Item out/renders/schematic.png example-schematic-windows.png -Force } else { "schematic png skipped (pdf-only)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-e2e
          if-no-files-found: error
          path: |
            example-3d-windows.png
            example-schematic-windows.png
            out/esp32-drc.json
            out/esp32-routed.kicad_pcb
