name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script syntax (both OSes)
        run: >
          python -m py_compile
          skills/kicad-pcb/scripts/kicad_paths.py
          skills/kicad-pcb/scripts/demo_autoroute.py
          skills/kicad-pcb/scripts/check_env.py
          skills/kicad-pcb/scripts/easyeda_bridge.py
          skills/kicad-pcb/scripts/esp32_example.py
          skills/kicad-pcb/scripts/simple_board.py
      - name: SKILL.md frontmatter (real YAML parse)
        run: |
          pip install pyyaml -q
          python -c "import yaml; from pathlib import Path; t = Path('skills/kicad-pcb/SKILL.md').read_text(encoding='utf-8'); d = yaml.safe_load(t.split('---')[1]); assert d.get('name') == 'kicad-pcb', 'wrong name'; assert d.get('description') and len(str(d['description'])) <= 1024, 'description missing or > 1024'; print('frontmatter OK:', d['name'])"
      - name: check_env (informational - runner without KiCad must fail with useful messages)
        run: python skills/kicad-pcb/scripts/check_env.py

  windows-e2e:
    # Real Windows validation: install KiCad + Freerouting, run the full example
    # (schematic + board + autoroute + 3D render + schematic export), upload renders.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad (winget)
        run: winget install --id KiCad.KiCad -e --accept-source-agreements --accept-package-agreements
      - name: KiCad-only board (no Freerouting) - ERC + DRC/parity must be clean
        run: python skills/kicad-pcb/scripts/simple_board.py --out simple-out
      - name: ESP32 schematic ERC - no label may land on the wrong pin
        shell: pwsh
        run: |
          python skills/kicad-pcb/scripts/esp32_example.py --stage sch --out esp-sch
          $cli = (Get-ChildItem "C:/Program Files/KiCad/*/bin/kicad-cli.exe" | Select-Object -Last 1).FullName
          & $cli sch erc --format json -o esp-sch/erc.json esp-sch/esp32-devboard.kicad_sch
          python -c "import json,sys; v=[x['type'] for s in json.load(open('esp-sch/erc.json'))['sheets'] for x in s['violations']]; bad=[t for t in v if t in ('label_dangling','ground_pin_not_ground')]; print(len(v),'ERC findings; wrong-pin indicators:',bad); sys.exit(1 if bad else 0)"
      - name: Install Freerouting (official MSI from GitHub releases)
        shell: pwsh
        run: |
          $url = "https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1-windows-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile freerouting.msi
          Start-Process msiexec -ArgumentList '/i','freerouting.msi','/qn' -Wait
          # MSI 2.4.1 installs per-user to AppData\Local\freerouting (jpackage layout)
          $fr = Get-ChildItem "$env:LOCALAPPDATA\freerouting" -Recurse -Filter "freerouting.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fr) { throw "freerouting.exe not found under $env:LOCALAPPDATA\freerouting" }
          "FREEROUTING_EXE=$($fr.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FREEROUTING_EXE=$($fr.FullName)"
      - name: Full example (ESP32 + LED + USB-C)
        # NOTE: kicad-cli is NOT on PATH (KiCad installer does not add bin\),
        # but the scripts resolve C:\Program Files\KiCad\*\bin\ themselves.
        # pymupdf converts the schematic PDF to PNG (no pdftoppm on Windows).
        shell: pwsh
        run: |
          python -m pip install pymupdf -q
          python skills/kicad-pcb/scripts/esp32_example.py --out out
          # the example re-execs in KiCad's python (no pymupdf there) and keeps
          # the PDF; convert it here with the runner python instead
          python -c "import fitz; doc = fitz.open('out/esp32-devboard.pdf'); doc[0].get_pixmap(dpi=150).save('out/renders/schematic.png')"
      - name: Rename Windows renders
        shell: pwsh
        run: |
          if (Test-Path out/renders/board-top.png) { Move-Item out/renders/board-top.png example-3d-windows.png -Force } else { "3D render skipped on this runner" }
          if (Test-Path out/renders/schematic.png) { Move-Item out/renders/schematic.png example-schematic-windows.png -Force } else { "schematic png skipped (pdf-only)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-e2e
          if-no-files-found: error
          path: |
            example-3d-windows.png
            example-schematic-windows.png
            out/esp32-drc.json
            out/esp32-routed.kicad_pcb
            simple-out/simple-led-3d-top.png
            simple-out/simple-led-gerbers.zip
            simple-out/drc.json
            simple-out/erc.json
