name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script syntax (both OSes)
        run: >
          python -m py_compile
          skills/kicad-pcb/scripts/kicad_paths.py
          skills/kicad-pcb/scripts/demo_autoroute.py
          skills/kicad-pcb/scripts/check_env.py
          skills/kicad-pcb/scripts/easyeda_bridge.py
          skills/kicad-pcb/scripts/esp32_example.py
          skills/kicad-pcb/scripts/simple_board.py
          skills/kicad-pcb/scripts/sch_gen.py
          .github/scripts/example_gate.py
      - name: SKILL.md frontmatter (real YAML parse)
        run: |
          pip install pyyaml -q
          python -c "import yaml; from pathlib import Path; t = Path('skills/kicad-pcb/SKILL.md').read_text(encoding='utf-8'); d = yaml.safe_load(t.split('---')[1]); assert d.get('name') == 'kicad-pcb', 'wrong name'; assert d.get('description') and len(str(d['description'])) <= 1024, 'description missing or > 1024'; print('frontmatter OK:', d['name'])"
      - name: check_env (informational - runner without KiCad must fail with useful messages)
        run: python skills/kicad-pcb/scripts/check_env.py

  windows-e2e:
    # Real Windows validation: KiCad (winget) + Freerouting (MSI). Runs both examples,
    # gates them (.github/scripts/example_gate.py) and uploads the renders.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad (winget) + pymupdf (schematic SVG -> PNG)
        run: |
          winget install --id KiCad.KiCad -e --accept-source-agreements --accept-package-agreements
          python -m pip install pymupdf -q
      - name: KiCad-only board (no Freerouting) - ERC + DRC/parity must be clean
        shell: pwsh
        run: |
          # native exit codes are handled here, not turned into exceptions by pwsh
          $PSNativeCommandUseErrorActionPreference = $false
          python skills/kicad-pcb/scripts/simple_board.py --out simple-out *> simple.log
          $rc = $LASTEXITCODE; Get-Content simple.log
          if ($rc -ne 0) {
            # logs need a GitHub login; annotations are public -> surface the tail there
            "::error title=simple_board.py exit $rc::" + ((Get-Content simple.log -Tail 30) -join '%0A')
            exit $rc
          }
      - name: Install Freerouting (official MSI from GitHub releases)
        shell: pwsh
        run: |
          $url = "https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1-windows-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile freerouting.msi
          Start-Process msiexec -ArgumentList '/i','freerouting.msi','/qn' -Wait
          # MSI 2.4.1 installs per-user to AppData\Local\freerouting (jpackage layout)
          $fr = Get-ChildItem "$env:LOCALAPPDATA\freerouting" -Recurse -Filter "freerouting.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fr) { throw "freerouting.exe not found under $env:LOCALAPPDATA\freerouting" }
          "FREEROUTING_EXE=$($fr.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FREEROUTING_EXE=$($fr.FullName)"
      - name: Full example (ESP32 + LED + USB-C) + gate
        # kicad-cli is NOT on PATH on Windows; the scripts resolve it themselves.
        # exit 4 = DRC findings present; the gate decides which ones are allowed.
        shell: pwsh
        run: |
          # native exit codes are handled here, not turned into exceptions by pwsh
          $PSNativeCommandUseErrorActionPreference = $false
          python skills/kicad-pcb/scripts/esp32_example.py --out out *> esp32.log
          $rc = $LASTEXITCODE; Get-Content esp32.log
          if ($rc -eq 4) { $rc = 0 }  # DRC findings: the gate below decides
          if ($rc -ne 0) {
            # logs need a GitHub login; annotations are public -> surface the tail there
            "::error title=esp32_example.py exit $rc::" + ((Get-Content esp32.log -Tail 30) -join '%0A')
            exit $rc
          }
          python .github/scripts/example_gate.py out *> gate.log
          $rc = $LASTEXITCODE; Get-Content gate.log
          if ($rc -ne 0) { "::error title=example_gate::" + ((Get-Content gate.log) -join '%0A'); exit $rc }
      - name: Collect renders
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force renders | Out-Null
          Copy-Item out/renders/* renders/ -ErrorAction SilentlyContinue
          Copy-Item simple-out/simple-led-3d-top.png, simple-out/simple-led-schematic.* renders/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e
          path: |
            renders/
            out/esp32-drc.json
            out/esp32-erc.json
            simple-out/drc.json
            simple-out/erc.json
            simple-out/simple-led-gerbers.zip

  linux-e2e:
    # Same pipeline on Ubuntu: KiCad 10 from the official PPA (pcbnew in the system
    # python3) + Freerouting linux-x64 bundle (embedded JRE, no system Java).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 10 (PPA) + xvfb (3D render) + pymupdf
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad kicad-symbols kicad-footprints xvfb unzip
          python3 -m pip install --break-system-packages -q pymupdf
      - name: Preflight
        run: python3 skills/kicad-pcb/scripts/check_env.py
      - name: KiCad-only board (no Freerouting) - ERC + DRC/parity must be clean
        run: |
          # logs need a GitHub login; annotations are public -> surface the tail there
          tail_note() { tail -30 "$1" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}'; }
          rc=0
          xvfb-run -a python3 skills/kicad-pcb/scripts/simple_board.py --out simple-out > simple.log 2>&1 || rc=$?
          cat simple.log
          if [ "$rc" -ne 0 ]; then
            echo "::error title=simple_board.py exit $rc::$(tail_note simple.log)"; exit "$rc"
          fi
      - name: Install Freerouting (linux-x64 bundle into ~/Work/tools, auto-detected)
        run: |
          mkdir -p ~/Work/tools
          curl -sSfL -o /tmp/fr.zip https://github.com/freerouting/freerouting/releases/download/v2.4.1/freerouting-2.4.1-linux-x64.zip
          unzip -q /tmp/fr.zip -d ~/Work/tools/freerouting-2.4.1
          python3 skills/kicad-pcb/scripts/kicad_paths.py
      - name: Full example (ESP32 + LED + USB-C) + gate
        run: |
          tail_note() { tail -30 "$1" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}'; }
          rc=0
          xvfb-run -a python3 skills/kicad-pcb/scripts/esp32_example.py --out out > esp32.log 2>&1 || rc=$?
          cat esp32.log
          [ "$rc" -eq 4 ] && rc=0  # DRC findings: the gate below decides
          if [ "$rc" -ne 0 ]; then
            echo "::error title=esp32_example.py exit $rc::$(tail_note esp32.log)"; exit "$rc"
          fi
          rc=0
          python3 .github/scripts/example_gate.py out > gate.log 2>&1 || rc=$?
          cat gate.log
          if [ "$rc" -ne 0 ]; then
            echo "::error title=example_gate::$(tail_note gate.log)"; exit "$rc"
          fi
      - name: Collect renders
        if: always()
        run: |
          mkdir -p renders
          cp out/renders/* renders/ 2>/dev/null || true
          cp simple-out/simple-led-3d-top.png simple-out/simple-led-schematic.* renders/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-e2e
          path: |
            renders/
            out/esp32-drc.json
            out/esp32-erc.json
            simple-out/drc.json
            simple-out/erc.json
            simple-out/simple-led-gerbers.zip
